name: Unit Tests
on:
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Run unit tests
      run: pnpm test
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: unit-tests-report
        path: unit-tests-report/
        retention-days: 30
